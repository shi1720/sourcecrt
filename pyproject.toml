[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sourcecrt"
version = "0.1.0"
description = "Exact source-aware bounded-vector modular reconstruction certificates"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
experiments = ["sympy==1.14.0", "numpy==2.5.4", "matplotlib==3.11.2"]
[tool.setuptools.packages.find]
where = ["src"]
